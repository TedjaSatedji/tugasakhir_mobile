name: tugasakhir_mobile
description: "Gen Z Life-RPG & Goal Tracker - Ubah produktivitas menjadi game!"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  
  # Database & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.0
  
  # Security
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3
  pointycastle: ^3.7.3
  
  # API & Web Service
  dio: ^5.3.1
  google_generative_ai: ^0.4.0
  
  # Location Services
  geolocator: ^11.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  geocoding: ^3.0.0
  
  # Biometric Authentication
  local_auth: ^2.2.0
  
  # Image Processing
  image_picker: ^1.0.4
  
  # UI Components
  flutter_svg: ^2.0.7
  animations: ^2.0.10
  lottie: ^2.7.0
  
  # Sensors
  sensors_plus: ^6.1.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.0.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  path: ^1.9.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true